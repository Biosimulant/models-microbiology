schema_version: '2.0'
title: Queralt2006 - Initiation of mitotic exit by downregulation of PP2A in budding
  yeast Lab
description: Curated microbiology lab for Queralt2006 - Initiation of mitotic exit
  by downregulation of PP2A in budding yeast. The bundled SBML is executed directly
  through Tellurium and visualised with conservative, source-traceable labels.
models:
- alias: queralt2006_pp2a_mitotic_exit
  path: models/core
- alias: visualisation
  path: models/visualisation
wiring:
- from: queralt2006_pp2a_mitotic_exit.state
  to:
  - visualisation.queralt2006_pp2a_mitotic_exit_state
- from: queralt2006_pp2a_mitotic_exit.summary
  to:
  - visualisation.queralt2006_pp2a_mitotic_exit_summary
- from: queralt2006_pp2a_mitotic_exit.species_labels
  to:
  - visualisation.queralt2006_pp2a_mitotic_exit_species_labels
- from: queralt2006_pp2a_mitotic_exit.clb2_cyclin_level
  to:
  - visualisation.queralt2006_pp2a_mitotic_exit_clb2_cyclin_level
- from: queralt2006_pp2a_mitotic_exit.cdc20_level
  to:
  - visualisation.queralt2006_pp2a_mitotic_exit_cdc20_level
- from: queralt2006_pp2a_mitotic_exit.cdh1_level
  to:
  - visualisation.queralt2006_pp2a_mitotic_exit_cdh1_level
- from: queralt2006_pp2a_mitotic_exit.securin_total
  to:
  - visualisation.queralt2006_pp2a_mitotic_exit_securin_total
runtime:
  duration: 10.0
  communication_step: 0.01
  initial_inputs: {}
io:
  inputs:
  - name: total_pp2a
    maps_to: queralt2006_pp2a_mitotic_exit.total_pp2a
  outputs:
  - name: state
    maps_to: queralt2006_pp2a_mitotic_exit.state
  - name: summary
    maps_to: queralt2006_pp2a_mitotic_exit.summary
  - name: species_labels
    maps_to: queralt2006_pp2a_mitotic_exit.species_labels
  - name: clb2_cyclin_level
    maps_to: queralt2006_pp2a_mitotic_exit.clb2_cyclin_level
  - name: cdc20_level
    maps_to: queralt2006_pp2a_mitotic_exit.cdc20_level
  - name: cdh1_level
    maps_to: queralt2006_pp2a_mitotic_exit.cdh1_level
  - name: securin_total
    maps_to: queralt2006_pp2a_mitotic_exit.securin_total
