schema_version: '2.0'
title: Liò2012_Modelling osteomyelitis_Control Model
description: BackgroundThis work focuses on the computational modelling of osteomyelitis,
  a bone pathology caused by bacteria infection (mostly Staphylococcus aureus). It
  can be used to explore microbiology li 2012 modelling osteomyelitis control dynamics
  and compare simulation behavior across conditions.
