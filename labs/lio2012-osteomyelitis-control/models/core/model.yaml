    maps_to: B
    label: B
  - name: bone_density
    maps_to: Bone_Density__z
    label: Bone Density (z)
  - name: osteoblasts
    maps_to: Osteoblasts__O_b
    label: Osteoblasts (O b)
  - name: osteoclasts
    maps_to: Osteoclasts__O_c
    label: Osteoclasts (O c)
