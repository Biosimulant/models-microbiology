        source: B
        label: B
      - port: bone_density
        source: Bone_Density__z
        label: Bone Density (z)
      - port: osteoblasts
        source: Osteoblasts__O_b
        label: Osteoblasts (O b)
      - port: osteoclasts
        source: Osteoclasts__O_c
        label: Osteoclasts (O c)
