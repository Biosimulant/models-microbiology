title: Gardner2000 - genetic toggle switch in E.coli
description: Gardner2000 - genetic toggle switch in E.coli The behaviour of the genetic
  toggle switch and the conditions for bistability has been studies using a synthetic,
  bistable gene circuit. It can be used to explore microbiology gardner2000 genetic
  toggle switch in dynamics and compare simulation behavior across conditions.
