schema_version: '2.0'
title: Balagaddé2008_E_coli_Predator_Prey
description: 'This is the reduced model described in the article: A synthetic Escherichia
  coli predator–prey ecosystem Balagaddé FK, Song H, Ozaki J, Collins CH, Barnet M,
  Arnold FH, Quake SR, You L. It can be used to explore microbiology balagadd 2008
  e coli predator dynamics and compare simulation behavior across conditions.'
