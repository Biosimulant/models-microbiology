    - alias: balagadde2008_ecoli_predator_prey
      observables:
      - id: IPTG
        label: IPTG
      - id: C1
        label: C1
      - id: C2
        label: C2
      - id: A1
        label: A1
      - id: A2
        label: A2
      - id: sink
        label: Sink
      - id: source
        label: Source
      labels:
        IPTG: IPTG
        C1: C1
        C2: C2
        A1: A1
        A2: A2
        sink: Sink
        source: Source
      headline_outputs:
      - port: cell_population_1
        source: C1
        label: C1
      - port: cell_population_2
        source: C2
        label: C2
      - port: quorum_signal_1
        source: A1
        label: A1
      - port: quorum_signal_2
        source: A2
        label: A2
    question: Do the engineered E. coli populations show predator-prey coexistence
      in the bundled SBML run?
