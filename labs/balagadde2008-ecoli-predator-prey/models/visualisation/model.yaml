    maps_to: balagadde2008_ecoli_predator_prey.cell_population_1
  - name: balagadde2008_ecoli_predator_prey_cell_population_2
    maps_to: balagadde2008_ecoli_predator_prey.cell_population_2
  - name: balagadde2008_ecoli_predator_prey_quorum_signal_1
    maps_to: balagadde2008_ecoli_predator_prey.quorum_signal_1
