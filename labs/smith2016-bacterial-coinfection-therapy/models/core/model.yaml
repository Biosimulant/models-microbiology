schema_version: '2.0'
title: Smith2016-Combination therapy to prevent bacterial coinfection during influenza.
description: Secondary bacterial infections (SBIs) exacerbate influenza-associated
  disease and mortality. Antimicrobial agents can reduce the severity of SBIs, but
  many have limited efficacy or cause adverse effec.
standard: sbml
tags:
- microbiology
- sbml
- biomodels_ebi
- faithful
- tellurium
authors:
- Biosimulant Team
- Amber M Smith
upstream:
  id: biomodels_ebi:MODEL1812040005
  source_db: biomodels_ebi
  source_id: MODEL1812040005
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/MODEL1812040005
  download_url: https://www.ebi.ac.uk/biomodels/model/download/MODEL1812040005?filename=Smith2016.xml
  license: CC0
biosim:
  entrypoint: src.smith2016_combination_therapy_to_prevent_bacteri_model1812040005_model:Smith2016CombinationTherapyToPreventBacteriModel1812040005Model
  init_kwargs:
    model_path: data/MODEL1812040005.xml
    integration_step: 1.0
  communication_step: 0.01
runtime:
  python_version: '3.12'
  dependencies:
    packages:
    - tellurium==2.2.11.2
io:
