    maps_to: species_labels
    label: Observable labels
  - name: target_cells
    maps_to: T
    label: T
  - name: infected_cells_type_1
    maps_to: I1
    label: I1
  - name: infected_cells_type_2
    maps_to: I2
    label: I2
  - name: viral_load
    maps_to: V
    label: V
