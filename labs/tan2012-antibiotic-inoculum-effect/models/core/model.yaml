schema_version: '2.0'
title: Tan2012 - Antibiotic Treatment, Inoculum Effect
description: Tan2012 - Antibiotic Treatment, Inoculum Effect The efficacy of many
  antibiotics decreases with increasing bacterial density, a phenomenon called the
  ‘inoculum effect’ (IE). It can be used to explore microbiology tan2012 antibiotic
  treatment inoculum effect dynamics and compare simulation behavior across conditions.
