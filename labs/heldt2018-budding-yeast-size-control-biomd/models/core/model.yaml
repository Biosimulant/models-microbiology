schema_version: '2.0'
title: Budding yeast size control by titration of nuclear sites
description: This model is decribed in the article:Dilution and titration of cell-cycle
  regulators may control cell size in budding yeastFrank S. It can be used to explore
  microbiology budding yeast size control by dynamics and compare simulation behavior
  across conditions.
standard: sbml
tags:
- microbiology
- sbml
- biomodels_ebi
- faithful
- tellurium
authors:
- Biosimulant Team
- Frank Stefan Heldt
- Reece Lunstone
- Tyson JJ
- Bela Novak
upstream:
  id: biomodels_ebi:BIOMD0000000856
  source_db: biomodels_ebi
  source_id: BIOMD0000000856
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/BIOMD0000000856
  download_url: https://www.ebi.ac.uk/biomodels/model/download/BIOMD0000000856?filename=Heldt2018.xml
  license: CC0
biosim:
  entrypoint: src.budding_yeast_size_control_by_titration_of_nucle_biomd0000000856_model:BuddingYeastSizeControlByTitrationOfNucleBiomd0000000856Model
  init_kwargs:
    model_path: data/BIOMD0000000856.xml
    integration_step: 1.0
  communication_step: 0.01
runtime:
  python_version: '3.12'
  dependencies:
    packages:
    - tellurium==2.2.11.2
io:
  inputs:
  - name: total_cln3
    maps_to: CLN3t
    label: Total Cln3
  - name: total_whi5
    maps_to: WHIt
    label: Total Whi5
  outputs:
  - name: state
    maps_to: state
    label: Model state
  - name: summary
    maps_to: summary
    label: Simulation summary
  - name: species_labels
    maps_to: species_labels
    label: Observable labels
  - name: titration_module_state
    maps_to: TM
    label: TM
  - name: growth_initiation_state
    maps_to: GI
    label: GI
  - name: growth_division_state
    maps_to: GD
    label: GD
  - name: growth_initiation_titration_complex
    maps_to: GITM
    label: GITM
