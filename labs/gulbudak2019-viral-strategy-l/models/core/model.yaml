schema_version: '2.0'
title: Gulbudak2019.1 - Heterogeneous viral strategies promote coexistence in virus-microbe
  systems (Lytic)
description: This is a mathematical model describing describing the population dynamics
  of microbes infected by lytic viruses. It can be used to explore microbiology gulbudak2019
