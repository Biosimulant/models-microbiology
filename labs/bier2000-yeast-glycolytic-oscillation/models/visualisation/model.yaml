schema_version: '2.0'
title: Bier2000_GlycolyticOscillation Visualisation
description: Question-and-answer visualisation for Bier2000_GlycolyticOscillation.
standard: other
tags:
- microbiology
- visualisation
biosim:
  communication_step: 1.0
  entrypoint: src.microbiology_visualisation:MicrobiologyVisualisationModel
  init_kwargs:
    sources:
    - alias: bier2000_yeast_glycolytic_oscillation
      observables:
      - id: G1
        label: Glucose 1
      - id: T1
        label: ATP 1
      - id: G2
        label: Glucose 2
      - id: T2
        label: ATP 2
      labels:
        G1: Glucose 1
        T1: ATP 1
        G2: Glucose 2
        T2: ATP 2
      headline_outputs:
      - port: glucose_pool_1
        source: G1
        label: Glucose 1
      - port: atp_pool_1
        source: T1
        label: ATP 1
      - port: glucose_pool_2
        source: G2
        label: Glucose 2
      - port: atp_pool_2
        source: T2
        label: ATP 2
    question: Does the yeast glycolysis model show dynamic changes in glycolytic intermediates?
    scope: metabolic pathway dynamics
    caveat: The bundled SBML is the executable source of truth; labels are conservative
      where source symbols are ambiguous.
io:
  inputs:
  - name: bier2000_yeast_glycolytic_oscillation_state
    maps_to: bier2000_yeast_glycolytic_oscillation.state
  - name: bier2000_yeast_glycolytic_oscillation_summary
    maps_to: bier2000_yeast_glycolytic_oscillation.summary
  - name: bier2000_yeast_glycolytic_oscillation_species_labels
    maps_to: bier2000_yeast_glycolytic_oscillation.species_labels
  - name: bier2000_yeast_glycolytic_oscillation_glucose_pool_1
    maps_to: bier2000_yeast_glycolytic_oscillation.glucose_pool_1
  - name: bier2000_yeast_glycolytic_oscillation_atp_pool_1
    maps_to: bier2000_yeast_glycolytic_oscillation.atp_pool_1
  - name: bier2000_yeast_glycolytic_oscillation_glucose_pool_2
    maps_to: bier2000_yeast_glycolytic_oscillation.glucose_pool_2
  - name: bier2000_yeast_glycolytic_oscillation_atp_pool_2
    maps_to: bier2000_yeast_glycolytic_oscillation.atp_pool_2
  outputs: []
