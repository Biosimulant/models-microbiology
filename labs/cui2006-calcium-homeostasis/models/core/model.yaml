    maps_to: CaMtotal
    label: Total Calmodulin
  outputs:
  - name: state
    maps_to: state
    label: Model state
  - name: summary
    maps_to: summary
    label: Simulation summary
  - name: species_labels
    maps_to: species_labels
    label: Observable labels
  - name: calcium_homeostasis_variable_one
    maps_to: m
    label: M
  - name: calcium_homeostasis_variable_two
    maps_to: z
    label: Z
  - name: calcium_homeostasis_variable_three
    maps_to: h
    label: H
  - name: calcium_homeostasis_variable_four
    maps_to: x
    label: X
