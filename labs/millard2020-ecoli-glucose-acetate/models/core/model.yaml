schema_version: '2.0'
title: Millard2020 - Kinetic model of Glucose and Acetate metabolisms in E. coli
description: 'Calibrated kinetic model of glucose and acetate metabolisms of Escherichia
  coli, as detailed in Millard et al., 2020 (DOI: 10.1101/2020.08.18.255356). It can
  be used to explore microbiology millard2020 kinetic of glucose and dynamics and
  compare simulation behavior across conditions.'
standard: sbml
tags:
- microbiology
- sbml
- biomodels_ebi
- faithful
- tellurium
authors:
- Biosimulant Team
- Millard
- Enjalbert
- Uttenweiler-Joseph
- Portais
- Létisse
upstream:
  id: biomodels_ebi:MODEL2005050001
  source_db: biomodels_ebi
  source_id: MODEL2005050001
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/MODEL2005050001
  download_url: https://www.ebi.ac.uk/biomodels/model/download/MODEL2005050001?filename=Millard2020_Ecoli_glc_ace_kinetic_model.xml
  license: CC0
biosim:
  entrypoint: src.millard2020_kinetic_model_of_glucose_and_acetate_model2005050001_model:Millard2020KineticModelOfGlucoseAndAcetateModel2005050001Model
  init_kwargs:
    model_path: data/MODEL2005050001.xml
    integration_step: 1.0
  communication_step: 0.01
runtime:
  python_version: '3.12'
  dependencies:
    packages:
    - tellurium==2.2.11.2
io:
  inputs:
  - name: external_glucose
    maps_to: Glc
    label: External Glucose
  - name: extracellular_acetate_level
    maps_to: Ace_out
    label: Extracellular Acetate Level
  - name: dilution_rate
    maps_to: _dilution_rate
    label: Dilution Rate
  - name: feed_rate
    maps_to: _feed
    label: Feed Rate
  outputs:
  - name: state
    maps_to: state
    label: Model state
  - name: summary
    maps_to: summary
    label: Simulation summary
  - name: species_labels
    maps_to: species_labels
    label: Observable labels
  - name: glucose
    maps_to: Glc
    label: Glc
  - name: acetate
    maps_to: Ace
    label: Ace
  - name: extracellular_acetate
    maps_to: Ace_out
    label: Ace out
  - name: input_regulator
    maps_to: X
    label: X
