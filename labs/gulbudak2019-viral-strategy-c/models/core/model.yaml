schema_version: '2.0'
title: Gulbudak2019.2 - Heterogeneous viral strategies promote coexistence in virus-microbe
  systems (Chronic)
description: This is a mathematical model describing describing the population dynamics
  of microbes infected by chronically infecting viruses. It can be used to explore
  microbiology gulbudak2019 2 heterogeneous viral strategies dynamics and compare
  simulation behavior across conditions.
