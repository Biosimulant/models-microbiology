schema_version: '2.0'
title: Talemi2014 - Arsenic toxicity and detoxification mechanisms in yeast
description: Talemi2014 - Arsenic toxicity anddetoxification mechanisms in yeast The
  model implements arsenite (AsIII)transport regulation, its distribution within main
  cellular AsIIIpools and detoxification. It can be used to explore microbiology talemi2014
  arsenic toxicity and detoxification dynamics and compare simulation behavior across
  conditions.
