schema_version: '2.0'
title: Cui2008 - in vitro transcriptional response of zinc homeostasis system in Escherichia
  coli
description: 'BACKGROUND: The zinc homeostasis system in Escherichia coli is one of
  the most intensively studied prokaryotic zinc homeostasis systems. Its underlying
  regulatory machine consists of repression on zin.'
